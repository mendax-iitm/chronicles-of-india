name: Validate and Smoke Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate data schemas and atom geometry
        run: npm run validate
      - name: Verify region atoms
        run: npm run check
      - name: Run Playwright smoke checks
        run: npm run smoke
      - name: Test single-file and GeoJSON builds
        run: |
          npm run build:dist
          npm run export:geojson
