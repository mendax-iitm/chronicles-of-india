<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chronicles of India — Interactive Historical Atlas</title>
<style>
:root{--navy:#0b2a5b;--ink:#111827;--mut:#5b6472;--line:#d9dde3;--sea:#e4eff7;--land:#f7f4ed;--gold:#c98a00}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100dvh;background:#fff;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 21px Georgia,serif;color:var(--navy)}
.sub{color:var(--mut);font-size:13px}
main{flex:1;min-height:0;display:flex}
#mapwrap{position:relative;flex:1;min-width:0;background:var(--sea);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#map.drag{cursor:grabbing}
.land{fill:var(--land);stroke:#b9b4a6;stroke-width:1;vector-effect:non-scaling-stroke}
.river{fill:none;stroke:#8fbbdc;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.lake{fill:var(--sea);stroke:#8fbbdc;stroke-width:.8;vector-effect:non-scaling-stroke}
.river.big{stroke-width:2.2}
.pol{fill-opacity:.8;stroke:#fff;stroke-opacity:.6;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer}
.pol.hov{fill-opacity:1}
.pol.sel{stroke:var(--navy);stroke-opacity:1;stroke-width:2}
.ghost{fill:none;stroke:#6b7280;stroke-width:1.2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
.himal{fill:#d9d2c0;opacity:.55;pointer-events:none}
.plab{font:600 11px system-ui,sans-serif;fill:#0b1f3a;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-opacity:.8;text-anchor:middle}
.geo{font:italic 11px Georgia,serif;fill:#6a7f93;paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-opacity:.6;text-anchor:middle}
.pname{font:600 11.5px system-ui,sans-serif;fill:var(--navy);paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-opacity:.9}
[data-k]{cursor:pointer}
.route{fill:none;stroke:var(--navy);stroke-width:2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;pointer-events:none}
#eracard{position:absolute;left:10px;top:10px;max-width:min(330px,70%);background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:10px;padding:8px 12px;pointer-events:none}
#eracard b{display:block;font:700 15px Georgia,serif;color:var(--navy)}
#eracard span{font-size:12.5px;color:var(--mut)}
#tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:12.5px;padding:4px 8px;border-radius:6px;max-width:240px;display:none;z-index:5}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button,.tg{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px;cursor:pointer;color:var(--navy)}
.tg{width:auto;padding:0 10px;font-size:12.5px;position:absolute;left:10px;bottom:10px;height:30px}
.tg.on{background:var(--navy);color:#fff}
#panel{width:370px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;padding:10px 4px;border:0;background:none;font:600 13.5px system-ui;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
#tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
#content{flex:1;overflow:auto;padding:14px 16px}
#content h2{margin:0 0 2px;font:700 19px Georgia,serif;color:var(--navy)}
#content h3{margin:16px 0 6px;font:700 12.5px system-ui;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
.rng{color:var(--mut);font-size:13px;margin-bottom:8px}
#content p{margin:6px 0}
ul.l{list-style:none;margin:0;padding:0}
ul.l li{display:flex;gap:8px;align-items:flex-start;padding:6px 6px;border-radius:8px;cursor:pointer}
ul.l li:hover,ul.l li.on{background:#eef3fa}
.chip{flex:none;width:13px;height:13px;border-radius:4px;margin-top:4px}
.dia{flex:none;width:11px;height:11px;margin-top:5px;background:var(--gold);transform:rotate(45deg)}
.small{font-size:12.5px;color:var(--mut)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fafbfd}
.gen{border-left:3px solid var(--line);margin:8px 0 0 6px;padding-left:12px}
.gen div{margin:0 0 9px;position:relative;opacity:.5}
.gen div.cur{opacity:1}
.gen div.cur::before{content:"";position:absolute;left:-18px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--navy)}
.gen b{color:var(--navy)}
button.pri{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 14px system-ui;cursor:pointer;margin:6px 6px 0 0}
button.sec{background:#fff;color:var(--navy);border:1px solid var(--navy);border-radius:8px;padding:7px 12px;font:600 13.5px system-ui;cursor:pointer;margin:6px 6px 0 0}
.big{font:700 34px Georgia,serif;color:var(--navy)}
footer#tl{display:flex;align-items:center;gap:10px;padding:8px 14px 14px;border-top:1px solid var(--line);background:#fff}
footer#tl button{width:36px;height:36px;border-radius:50%;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:15px;cursor:pointer;flex:none}
footer#tl button#play{background:var(--navy);color:#fff}
.track{position:relative;flex:1;height:44px}
#yr{width:100%;margin:0;position:absolute;top:0;left:0;accent-color:var(--navy)}
#ticks{position:absolute;left:8px;right:8px;top:24px;height:18px}
#ticks i{position:absolute;top:0;width:2px;height:10px;background:#7a8aa3;cursor:pointer;transform:translateX(-1px);border-radius:1px}
#ticks i.on{background:var(--navy);height:16px;width:3px}
#ylab{flex:none;min-width:92px;text-align:right;font:700 20px Georgia,serif;color:var(--navy)}
.note{font-size:11.5px;color:var(--mut);padding:6px 16px 10px;border-top:1px solid var(--line)}
@media(max-width:820px){
 main{flex-direction:column}
 #mapwrap{flex:1.15}
 #panel{width:100%;flex:1;border-left:0;border-top:1px solid var(--line)}
 header{padding:8px 12px}.sub{display:none}h1{font-size:18px}
 #ylab{font-size:16px;min-width:74px}
 #eracard{max-width:58%;padding:6px 10px}#eracard span{display:none}#eracard b{font-size:14px}
}
</style>
</head>
<body>
<header><h1>Chronicles of India</h1><span class="sub">An interactive historical atlas · 600 BCE – 1947 CE</span></header>
<main>
 <section id="mapwrap">
  <svg id="map" xmlns="http://www.w3.org/2000/svg">
   <defs><clipPath id="clipLand"><path id="clipPoly"/></clipPath></defs>
   <g id="world">
    <path id="land" class="land"/><g id="lakes"></g>
    <polygon id="himal" class="himal"/>
    <g id="rivers"></g>
    <g id="pols" clip-path="url(#clipLand)"></g>
    <g id="route"></g>
    <g id="ov"></g>
   </g>
  </svg>
  <div id="eracard"></div>
  <div id="tip"></div>
  <div class="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="zr" aria-label="Reset view" style="font-size:14px">⌂</button></div>
  <button class="tg on" id="tgGhost" title="Dashed outlines show regions that changed hands since the previous era">Ghost borders</button>
 </section>
 <aside id="panel">
  <div id="tabs"><button data-t="era" class="on">Era</button><button data-t="places">Places</button><button data-t="journeys">Journeys</button><button data-t="quiz">Quiz</button></div>
  <div id="content"></div>
  <div class="note">Boundaries are schematic approximations for learning, not surveyed borders. Concept inspired by the open-source “Chronicles of the Realm” atlas of China; code and data here are original.</div>
 </aside>
</main>
<footer id="tl">
 <button id="prev" aria-label="Previous era">⏮</button><button id="play" aria-label="Play">▶</button><button id="next" aria-label="Next era">⏭</button>
 <div class="track"><input type="range" id="yr" min="-600" max="1947" value="-261" step="1"><div id="ticks"></div></div>
 <div id="ylab"></div>
</footer>

<script src="data/base.js"></script>

/* ---------- state ---------- */
const st={year:-261,tab:'era',si:0,selPol:-1,selPlace:-1,selEv:-1,jr:-1,ghost:true,play:false,walk:null,
 quiz:{on:false,rounds:[],i:0,score:0,res:null,guess:null,done:false}};
const svg=$('#map'),vb={x:0,y:0,w:W,h:H};

/* ---------- init static layers ---------- */
const lineD=r=>'M'+ptsStr(r).replace(/ /g,'L'), ringsD=rs=>rs.map(r=>lineD(r)+'Z').join('');

/* ---------- view ---------- */
const scl=()=>svg.clientWidth/vb.w;
function applyVB(){
 const r=svg.getBoundingClientRect();vb.h=vb.w*r.height/r.width;
 const lo=-W*.3,hi=W*1.3;
 vb.x=Math.min(Math.max(vb.x,lo),Math.max(lo,hi-vb.w));
 vb.y=Math.min(Math.max(vb.y,-H*.3),Math.max(-H*.3,H*1.3-vb.h));
 svg.setAttribute('viewBox',`${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);
 drawOv();
}
function resetView(){const r=svg.getBoundingClientRect();vb.w=Math.max(W*.82,H*.86*r.width/r.height);vb.h=vb.w*r.height/r.width;vb.x=W*.5-vb.w/2;vb.y=H*.47-vb.h/2;applyVB()}
function zoomAt(f,fx,fy){const nw=Math.min(Math.max(vb.w*f,W/18),W*1.4);const wx=vb.x+fx*vb.w,wy=vb.y+fy*vb.h;const hh=vb.h/vb.w;vb.x=wx-fx*nw;vb.y=wy-fy*nw*hh;vb.w=nw;applyVB()}
function flyTo(lon,lat,w){
 const r=svg.getBoundingClientRect();w=Math.max(W/18,Math.min(w||vb.w,W*1.4));const h=w*r.height/r.width;
 const t={x:px(lon)-w/2,y:py(lat)-h/2,w},s={x:vb.x,y:vb.y,w:vb.w};const t0=performance.now();
 (function f(now){const k=Math.min(1,(now-t0)/450),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;vb.x=s.x+(t.x-s.x)*e;vb.y=s.y+(t.y-s.y)*e;vb.w=s.w+(t.w-s.w)*e;applyVB();if(k<1)requestAnimationFrame(f)})(t0);
}

/* ---------- drawing ---------- */
function drawPols(){
 const s=SN[st.si];let h='';
 if(!st.quiz.on){
  if(st.ghost&&st.si>0){const prev=SN[st.si-1];for(const k in prev.owner){if(prev.owner[k]!==s.owner[k])h+=`<polygon class="ghost" points="${AP[k]}"/>`}}
  s.pol.forEach((p,i)=>p.atoms.forEach(k=>{h+=`<polygon class="pol${i===st.selPol?' sel':''}" data-pi="${i}" points="${AP[k]}" fill="${p.c}"/>`}));
 }
 $('#pols').innerHTML=h;
}
function glyph(inner,lon,lat,attrs){const s=scl();return `<g transform="translate(${px(lon).toFixed(1)} ${py(lat).toFixed(1)}) scale(${(1/s).toFixed(4)})" ${attrs||''}>${inner}</g>`}
function nameAt(p,y){let c=null;for(const n of p.n)if(n[0]<=y)c=n;return c}
function wrap(n){if(n.length<=13||n.indexOf(' ')<0)return[n];const m=n.length/2;let b=-1,bd=99;for(let i=0;i<n.length;i++)if(n[i]===' '&&Math.abs(i-m)<bd){bd=Math.abs(i-m);b=i}return[n.slice(0,b),n.slice(b+1)]}
function drawOv(){
 let h='';const q=st.quiz,s=SN[st.si],y=st.year;
 GEO.forEach(g=>h+=glyph(`<text class="geo">${g[0]}</text>`,g[1],g[2],'pointer-events="none"'));
 if(scl()>1.6)B.rivers.forEach(r=>h+=glyph(`<text class="geo" style="fill:#4f86b3">${r.name}</text>`,r.label[0],r.label[1],'pointer-events="none"'));
 if(!q.on){
  const sc=scl(),boxes=[];
  const free=(x,y,w,hh)=>{for(const b of boxes)if(x<b[0]+b[2]&&x+w>b[0]&&y<b[1]+b[3]&&y+hh>b[1])return false;boxes.push([x,y,w,hh]);return true};
  s.pol.slice().sort((a,b)=>b.area-a.area).forEach(p=>{if(p.area<4.5)return;const ls=wrap(p.n);
   const w=Math.max(...ls.map(t=>t.length))*6.4+6,hh=ls.length*12+4;
   if(!free(px(p.lon)*sc-w/2,py(p.lat)*sc-hh/2,w,hh))return;
   h+=glyph(`<text class="plab">${ls.map((t,i)=>`<tspan x="0" dy="${i?12:(ls.length>1?-3:4)}">${esc(t)}</tspan>`).join('')}</text>`,p.lon,p.lat,'pointer-events="none"')});
  const pls=PL.filter(p=>nameAt(p,y)).sort((a,b)=>(b.id===st.selPlace)-(a.id===st.selPlace));
  pls.forEach(p=>{const c=nameAt(p,y),on=p.id===st.selPlace,w=c[1].length*6.6+4;
   const lab=free(px(p.lon)*sc+8,py(p.lat)*sc-8,w,16)||on;
   h+=glyph(`<circle r="${on?7:5}" fill="${on?'#c98a00':'#0b2a5b'}" stroke="#fff" stroke-width="2"/>${lab?`<text class="pname" x="9" y="4">${esc(c[1])}</text>`:''}`,p.lon,p.lat,`data-k="p:${p.id}"`)});
  EV.forEach(e=>{if(Math.abs(e.y-y)>30&&e.id!==st.selEv)return;
   h+=glyph(`<path d="M0,-8 L8,0 L0,8 L-8,0Z" fill="#e9a400" stroke="#fff" stroke-width="2"/>`,e.lon,e.lat,`data-k="e:${e.id}"`)});
  if(st.jr>=0){const j=JR[st.jr];j.s.forEach((p,i)=>{const done=y>=p[3];
   h+=glyph(`<circle r="10" fill="${done?'#0b2a5b':'#fff'}" stroke="#0b2a5b" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="${done?'#fff':'#0b2a5b'}">${i+1}</text>`,p[1],p[2],`data-k="j:${i}"`)})}
 }else{
  if(q.res){h+=`<line x1="${px(q.res.gl).toFixed(1)}" y1="${py(q.res.ga).toFixed(1)}" x2="${px(q.res.tl).toFixed(1)}" y2="${py(q.res.ta).toFixed(1)}" class="route" stroke="#b42318"/>`;
   h+=glyph(`<circle r="7" fill="#0b2a5b" stroke="#fff" stroke-width="2"/>`,q.res.gl,q.res.ga,'pointer-events="none"');
   h+=glyph(`<circle r="8" fill="#1a8f4c" stroke="#fff" stroke-width="2"/><text class="pname" x="11" y="4">${esc(q.res.name)}</text>`,q.res.tl,q.res.ta,'pointer-events="none"')}
 }
 $('#ov').innerHTML=h;
}
function drawRoute(){
 $('#route').innerHTML=(st.jr>=0&&!st.quiz.on)?`<polyline class="route" points="${ptsStr(JR[st.jr].s.map(p=>[p[1],p[2]]))}"/>`:'';
}

/* ---------- time ---------- */
function snapAt(y){let k=0;SN.forEach((s,i)=>{if(s.from<=y)k=i});return k}
function setYear(y,keepView){
 y=Math.max(-600,Math.min(1947,Math.round(y)));if(y===0)y=1;
 st.year=y;$('#yr').value=y;$('#ylab').textContent=fy(y);
 const si=snapAt(y),ch=si!==st.si;st.si=si;
 if(ch){st.selPol=-1;drawPols();}
 [...$('#ticks').children].forEach((t,i)=>t.classList.toggle('on',i===si));
 const s=SN[si];$('#eracard').innerHTML=`<b>${esc(s.title)}</b><span>${rg(s)} · map shown at ${s.rep}</span>`;
 drawOv();
 if(st.tab==='era'&&ch)render();else if(st.tab==='places'||st.tab==='journeys')render(true);
}

/* ---------- panel ---------- */
const chipLi=(c,t,a,on)=>`<li data-a="${a}" class="${on?'on':''}"><span class="chip" style="background:${c}"></span><span>${t}</span></li>`;
function render(soft){
 const c=$('#content'),sc=c.scrollTop;let h='';
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===st.tab));
 if(st.tab==='era'){
  const s=SN[st.si];
  h+=`<h2>${esc(s.title)}</h2><div class="rng">${rg(s)}</div><p>${esc(s.sum)}</p>`;
  h+=`<h3>Powers on the map</h3><ul class="l">`+s.pol.map((p,i)=>chipLi(p.c,`<b>${esc(p.n)}</b>${i===st.selPol?`<br><span class="small">${esc(p.t)}</span>`:''}`,'pol:'+i,i===st.selPol)).join('')+`</ul>`;
  const evs=EV.filter(e=>e.y>=s.from&&e.y<=s.to);
  if(evs.length)h+=`<h3>Events in this era</h3><ul class="l">`+evs.map(e=>`<li data-a="ev:${e.id}" class="${e.id===st.selEv?'on':''}"><span class="dia"></span><span><b>${fy(e.y)}</b> · ${esc(e.t)}${e.id===st.selEv?`<br><span class="small">${esc(e.d)}</span>`:''}</span></li>`).join('')+`</ul>`;
  h+=`<p class="small" style="margin-top:12px">Tip: tap a region or a ◆ for details. Dashed outlines show lands that changed hands since the previous era.</p>`;
 }else if(st.tab==='places'){
  const vis=PL.filter(p=>nameAt(p,st.year));
  if(st.selPlace>=0){const p=PL[st.selPlace],cur=nameAt(p,st.year);
   h+=`<button class="sec" data-a="pl:back">← All places</button>`;
   if(cur){h+=`<h2 style="margin-top:10px">${esc(cur[1])}</h2><div class="rng">Name in ${fy(st.year)}</div><p>${esc(cur[2])}</p>`}
   else h+=`<h2 style="margin-top:10px">${esc(p.n[0][1])}</h2><div class="rng">Not yet founded in ${fy(st.year)}</div>`;
   h+=`<h3>Name through the ages</h3><div class="gen">`+p.n.map(n=>`<div class="${cur&&n===cur?'cur':''}"><b>${fy(n[0])} · ${esc(n[1])}</b><br><span class="small">${esc(n[2])}</span></div>`).join('')+`</div>`;
   h+=`<button class="pri" data-a="pl:fly:${p.id}">Show on map</button>`;
   if(!cur)h+=`<button class="sec" data-a="pl:year:${p.id}">Jump to ${fy(p.n[0][0])}</button>`;
  }else{
   h+=`<h2>Place genealogy</h2><p class="small">Cities change names and masters. Pick one to trace its names across the eras. Showing places existing in ${fy(st.year)}.</p><ul class="l">`+vis.map(p=>{const n=nameAt(p,st.year);return `<li data-a="pl:${p.id}"><span class="chip" style="background:#0b2a5b;border-radius:50%"></span><span><b>${esc(n[1])}</b>${p.n.length>1?`<br><span class="small">${p.n.length} names over time</span>`:''}</span></li>`}).join('')+`</ul>`;
  }
 }else if(st.tab==='journeys'){
  if(st.jr>=0){const j=JR[st.jr];
   h+=`<button class="sec" data-a="jr:back">← All journeys</button><h2 style="margin-top:10px">${esc(j.n)}</h2><div class="rng">${esc(j.who)} · ${j.yrs}</div><p>${esc(j.d)}</p>`;
   h+=`<button class="pri" data-a="jr:walk">${st.walk?'■ Stop':'▶ Walk the route'}</button><ul class="l" style="margin-top:6px">`+j.s.map((p,i)=>`<li data-a="js:${i}" class="${st.year>=p[3]?'on':''}"><span class="chip" style="background:#0b2a5b;border-radius:50%;color:#fff;font:700 9px/13px system-ui;text-align:center">${i+1}</span><span><b>${esc(p[0])}</b> · ${fy(p[3])}<br><span class="small">${esc(p[4])}</span></span></li>`).join('')+`</ul>`;
  }else h+=`<h2>Journeys through time</h2><p class="small">Follow travellers across the map. Stops light up as the timeline reaches them.</p><ul class="l">`+JR.map((j,i)=>`<li data-a="jr:${i}"><span class="chip" style="background:#0b2a5b"></span><span><b>${esc(j.n)}</b><br><span class="small">${esc(j.who)} · ${j.yrs}</span></span></li>`).join('')+`</ul>`;
 }else{
  const q=st.quiz;
  if(!q.on)h+=`<h2>Pinpoint quiz</h2><p>Six rounds. You’re given a historic city; tap where you think it was. Closer guesses score higher (max 100 each).</p><button class="pri" data-a="q:start">Start quiz</button>`;
  else if(q.done){const tot=Math.round(q.score);h+=`<h2>Finished!</h2><div class="big">${tot} / 600</div><p>${tot>480?'Master cartographer.':tot>300?'Solid historian’s instinct.':'Keep exploring the Places tab — then try again.'}</p><button class="pri" data-a="q:start">Play again</button><button class="sec" data-a="q:quit">Back to the atlas</button>`}
  else{const t=q.rounds[q.i];h+=`<div class="rng">Round ${q.i+1} of ${q.rounds.length} · Score ${Math.round(q.score)}</div><h2>Where was ${esc(t.n[0][1])}?</h2><p class="small">${esc(t.n[0][2])}</p>`;
   if(q.res)h+=`<div class="card"><b>${q.res.d} km away</b> · +${q.res.pts} points<br><span class="small">The green dot is ${esc(q.res.name)}.</span></div><button class="pri" data-a="q:next">${q.i+1<q.rounds.length?'Next':'See score'}</button>`;
   else h+=`<p>Tap the map to place your guess.</p>`;
   h+=`<button class="sec" data-a="q:quit">Quit</button>`}
 }
 c.innerHTML=h;if(soft)c.scrollTop=sc;
}
function go(tab){if(st.quiz.on&&tab!=='quiz')quitQuiz(true);st.tab=tab;render()}

/* ---------- actions ---------- */
function act(a){
 const [k,v,w]=a.split(':');
 if(k==='pol'){st.selPol=st.selPol==+v?-1:+v;drawPols();render(true)}
 else if(k==='ev'){st.selEv=+v;const e=EV[+v];st.selEv=e.id;setYear(e.y);flyTo(e.lon,e.lat,W/3.2);render(true)}
 else if(k==='pl'){
  if(v==='back'){st.selPlace=-1;drawOv();render()}
  else if(v==='fly'){const p=PL[+w];flyTo(p.lon,p.lat,W/3)}
  else if(v==='year'){const p=PL[+w];setYear(p.n[0][0]);render()}
  else{st.selPlace=+v;const p=PL[+v];drawOv();render();flyTo(p.lon,p.lat,Math.min(vb.w,W/2))}}
 else if(k==='jr'){
  if(v==='back'){stopWalk();st.jr=-1;drawRoute();drawOv();render()}
  else if(v==='walk'){st.walk?stopWalk():startWalk()}
  else{st.jr=+v;const j=JR[+v];drawRoute();setYear(j.s[0][3]);render();flyTo(j.s[0][1],j.s[0][2],W/2.2);fitJourney()}}
 else if(k==='js'){const p=JR[st.jr].s[+v];setYear(p[3]);flyTo(p[1],p[2],W/3.2);render(true)}
 else if(k==='q'){if(v==='start')startQuiz();else if(v==='next')nextQ();else if(v==='quit')quitQuiz()}
}
function fitJourney(){const j=JR[st.jr];let a=999,b=-999,c=999,d=-999;j.s.forEach(p=>{a=Math.min(a,p[1]);b=Math.max(b,p[1]);c=Math.min(c,p[2]);d=Math.max(d,p[2])});
 const w=Math.max((b-a)*K*XF*1.5,(d-c)*K*1.5*svg.clientWidth/svg.clientHeight,W/6);flyTo((a+b)/2,(c+d)/2,w)}
function startWalk(){const j=JR[st.jr];let i=0;st.walk=setInterval(()=>{if(i>=j.s.length){stopWalk();return}const p=j.s[i++];setYear(p[3]);flyTo(p[1],p[2],W/3.2);render(true)},2600);
 const p=j.s[0];setYear(p[3]);flyTo(p[1],p[2],W/3.2);st.walkI=1;i=1;render(true)}
function stopWalk(){if(st.walk){clearInterval(st.walk);st.walk=null;if(st.tab==='journeys')render(true)}}

/* ---------- quiz ---------- */
const hav=(a,b,c,d)=>{const R=6371,r=Math.PI/180,dl=(c-a)*r,dp=(d-b)*r,x=Math.sin(dp/2)**2+Math.cos(b*r)*Math.cos(d*r)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
function startQuiz(){stopWalk();const q=st.quiz;q.on=true;q.done=false;q.score=0;q.i=0;q.res=null;
 q.rounds=PL.slice().sort(()=>Math.random()-.5).slice(0,6);st.selPol=-1;st.selPlace=-1;st.jr=-1;drawRoute();drawPols();resetView();render()}
function nextQ(){const q=st.quiz;q.res=null;q.i++;if(q.i>=q.rounds.length)q.done=true;drawOv();render()}
function quitQuiz(silent){const q=st.quiz;q.on=false;q.res=null;drawPols();drawOv();if(!silent){st.tab='era';render()}}
function guess(lon,lat){const q=st.quiz;if(!q.on||q.done||q.res)return;const t=q.rounds[q.i];
 const d=Math.round(hav(lon,lat,t.lon,t.lat)),pts=Math.max(0,Math.round(100*(1-d/900)));q.score+=pts;
 q.res={d,pts,gl:lon,ga:lat,tl:t.lon,ta:t.lat,name:t.n[0][1]};drawOv();render()}

/* ---------- pointer interaction ---------- */
const ptrs=new Map();let pinch=0;
function toLonLat(cx,cy){const r=svg.getBoundingClientRect();const x=vb.x+(cx-r.left)/r.width*vb.w,y=vb.y+(cy-r.top)/r.height*vb.h;return[x/(K*XF)+58,39-y/K]}
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1)drag={sx:e.clientX,sy:e.clientY,vx:vb.x,vy:vb.y,moved:false,t:e.target};
 else{const[a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);if(drag)drag.moved=true}});
svg.addEventListener('pointermove',e=>{
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch){const r=svg.getBoundingClientRect();zoomAt(pinch/d,((a.x+b.x)/2-r.left)/r.width,((a.y+b.y)/2-r.top)/r.height)}pinch=d;return}
 if(drag&&ptrs.size===1){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)>5){drag.moved=true;svg.classList.add('drag');tip()}
  if(drag.moved){const s=scl();vb.x=drag.vx-dx/s;vb.y=drag.vy-dy/s;applyVB()}return}
 hover(e)});
function end(e){ptrs.delete(e.pointerId);pinch=0;svg.classList.remove('drag');
 if(drag&&!drag.moved&&ptrs.size===0&&e.type==='pointerup')clickAt(e,drag.t);
 if(ptrs.size===0)drag=null}
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
svg.addEventListener('pointerleave',()=>{tip();setHov(-1)});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(e.deltaY*.0015),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
function clickAt(e,t){
 if(st.quiz.on){const[lo,la]=toLonLat(e.clientX,e.clientY);guess(lo,la);return}
 const kEl=t.closest&&t.closest('[data-k]');
 if(kEl){const[k,v]=kEl.dataset.k.split(':');
  if(k==='p'){st.selPlace=+v;go('places')+0;drawOv()}
  else if(k==='e'){st.selEv=+v;go('era');drawOv();render(true)}
  else if(k==='j'){const p=JR[st.jr].s[+v];setYear(p[3]);st.tab='journeys';render(true)}
  return}
 const pEl=t.closest&&t.closest('[data-pi]');
 if(pEl){st.selPol=st.selPol==+pEl.dataset.pi?-1:+pEl.dataset.pi;drawPols();st.tab='era';render(true)}
}
function setHov(i){if(i===hovPol)return;document.querySelectorAll('.pol.hov').forEach(n=>n.classList.remove('hov'));hovPol=i;if(i>=0)document.querySelectorAll(`.pol[data-pi="${i}"]`).forEach(n=>n.classList.add('hov'))}
function tip(t,e){const el=$('#tip');if(!t){el.style.display='none';return}const r=$('#mapwrap').getBoundingClientRect();el.innerHTML=t;el.style.display='block';
 el.style.left=Math.min(e.clientX-r.left+12,r.width-el.offsetWidth-6)+'px';el.style.top=Math.max(e.clientY-r.top-el.offsetHeight-10,4)+'px'}
function hover(e){
 if(st.quiz.on){tip();return}
 const t=e.target,k=t.closest&&t.closest('[data-k]'),p=t.closest&&t.closest('[data-pi]');
 if(k){const[a,v]=k.dataset.k.split(':');let s='';
  if(a==='p'){const n=nameAt(PL[+v],st.year);s=`<b>${esc(n[1])}</b>`}else if(a==='e'){const ev=EV[+v];s=`<b>${fy(ev.y)}</b> · ${esc(ev.t)}`}else if(a==='j'){const q=JR[st.jr].s[+v];s=`<b>${+v+1}. ${esc(q[0])}</b> · ${fy(q[3])}`}
  setHov(-1);tip(s,e)}
 else if(p){const i=+p.dataset.pi;setHov(i);tip(`<b>${esc(SN[st.si].pol[i].n)}</b>`,e)}
 else{setHov(-1);tip()}
}

/* ---------- wiring ---------- */
$('#zi').onclick=()=>zoomAt(.7,.5,.5);$('#zo').onclick=()=>zoomAt(1.45,.5,.5);$('#zr').onclick=resetView;
$('#tgGhost').onclick=e=>{st.ghost=!st.ghost;e.target.classList.toggle('on',st.ghost);drawPols()};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};
$('#content').onclick=e=>{const li=e.target.closest('[data-a]');if(li)act(li.dataset.a)};
$('#yr').oninput=e=>{if(st.quiz.on)return;stopPlay();setYear(+e.target.value)};
$('#prev').onclick=()=>{if(st.quiz.on)return;stopPlay();const i=st.year>SN[st.si].from?st.si:Math.max(0,st.si-1);setYear(SN[i].from)};
$('#next').onclick=()=>{if(st.quiz.on)return;stopPlay();setYear(SN[Math.min(SN.length-1,st.si+1)].from)};
function stopPlay(){if(st.play){clearInterval(st.play);st.play=null;$('#play').textContent='▶'}}
$('#play').onclick=()=>{if(st.quiz.on)return;if(st.play){stopPlay();return}$('#play').textContent='❚❚';if(st.year>=1940)setYear(-600);
 st.play=setInterval(()=>{if(st.year>=1947){stopPlay();return}setYear(st.year+(st.year<0&&st.year+8>=0?9:8))},120)};
$('#ticks').innerHTML=SN.map(s=>`<i style="left:${((s.from+600)/2547*100).toFixed(2)}%" title="${esc(s.title)} (${fy(s.from)})" data-y="${s.from}"></i>`).join('');
$('#ticks').onclick=e=>{const i=e.target.closest('i');if(i&&!st.quiz.on){stopPlay();setYear(+i.dataset.y)}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')setYear(st.year+10);if(e.key==='ArrowLeft')setYear(st.year-10)});
new ResizeObserver(()=>applyVB()).observe(svg);

drawPols();setYear(-261);resetView();render();
window.atlas={st,SN,PL,EV,JR,setYear,act};
</script>
</body>
