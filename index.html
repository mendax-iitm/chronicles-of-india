<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chronicles of India — Interactive Historical Atlas</title>
<link rel="stylesheet" href="css/atlas.css">
</head>
<body>
<header><h1>Chronicles of India</h1><span class="sub">An interactive historical atlas · 600 BCE – 1947 CE</span></header>
<main>
 <section id="mapwrap">
  <svg id="map" xmlns="http://www.w3.org/2000/svg" role="region" aria-label="Historical map of South Asia">
   <defs><clipPath id="clipLand"><path id="clipPoly"/></clipPath></defs>
   <g id="world">
    <path id="land" class="land"/><g id="terrain" clip-path="url(#clipLand)"></g><g id="lakes"></g>
    <g id="relief"></g>
    <g id="rivers"></g>
    <g id="pols" clip-path="url(#clipLand)"></g>
    <g id="route"></g>
    <g id="ov"></g>
   </g>
  </svg>
  <div id="eracard"></div>
  <div id="tip"></div>
  <div class="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="zr" aria-label="Reset view" style="font-size:14px">⌂</button></div>
  <button class="tg on" id="tgGhost" title="Dashed outlines show regions that changed hands since the previous era">Ghost borders</button>
 </section>
 <aside id="panel">
  <div id="tabs" role="tablist"><button data-t="era" class="on" role="tab" aria-selected="true">Era</button><button data-t="places" role="tab" aria-selected="false">Places</button><button data-t="journeys" role="tab" aria-selected="false">Journeys</button><button data-t="quiz" role="tab" aria-selected="false">Quiz</button></div>
  <div id="content"></div>
  <div class="note">Boundaries are schematic approximations for learning, not surveyed borders. Concept inspired by the open-source “Chronicles of the Realm” atlas of China; code and data here are original.</div>
 </aside>
</main>
<footer id="tl">
 <button id="prev" aria-label="Previous era">⏮</button><button id="play" aria-label="Play">▶</button><button id="next" aria-label="Next era">⏭</button>
 <div class="track"><input type="range" id="yr" min="-600" max="1947" value="-261" step="1" aria-label="Timeline slider: historical year"><div id="ticks"></div></div>
 <div id="ylab"></div>
</footer>

<!-- Base geodata & historical content -->
<script src="data/base.js"></script>
<script src="data/regions.js"></script>
<script src="data/snapshots.js"></script>
<script src="data/places.js"></script>
<script src="data/events.js"></script>
<script src="data/journeys.js"></script>

<!-- Atlas application modules -->
<script src="js/projection.js"></script>
<script src="js/render.js"></script>
<script src="js/timeline.js"></script>
<script src="js/panel.js"></script>
<script src="js/api.js"></script>
<script src="js/atlas.js"></script>
</body>
</html>
